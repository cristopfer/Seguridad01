<!DOCTYPE html>
<html lang="es">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCSE-MenuProfesores-2</title>
    <link href="assets/CSS/SCSE-MP2.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">     
</head>
<body>
    <header> 
        <div id="cabecero">
            <div id="Logo-titulo">
                <a id="Logo" href="">
                    <div id="contenedor_imagen"><img src="assets/images/SeMaslogo_st.png" alt="Logo de SeMas"/></div>
                    <p class="separacion_elementos_cabecero">Sémás</p>
                </a>
            </div>
            <nav>
                <a href="SCSE-Register.html"><i class="glyphicon glyphicon-user"></i> Registrarse</a>
            </nav>
        </div>
    </header><br>
    <section>
        <div class="row">
            <div class="col-md-4"></div>
            <div class="col-md-4">
                <div class="panel-group">
                    <div class="panel panel-warning">
                        <div class="panel-heading" style="text-align: center;">LOGIN</div>
                        <div class="panel-body" style="text-align: center;">
                            <h2 style="text-align: center;">USER LOGIN</h2>
                            <input 
                                class="form-control" 
                                type="text" 
                                id="username" 
                                placeholder="Nombre de usuario" 
                                pattern="^[A-Za-z0-9]+$" 
                                title="El nombre de usuario solo puede contener letras y números, sin espacios ni caracteres especiales." 
                                required>
                            <br><br>
                            <input 
                                class="form-control" 
                                type="password" 
                                id="password" 
                                placeholder="Contraseña" 
                                pattern="^[A-Za-z0-9]+$" 
                                title="La contraseña solo puede contener letras y números, sin espacios ni caracteres especiales." 
                                required>
                            <br><br>
                            <button id="boton" class="btn btn-warning">Entrar</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4"></div>
        </div>
    </section>
    <script type="text/javascript" src="https://code.jquery.com/jquery-3.6.4.js"></script>
    <script>
        $("#boton").on("click", function(event) {
            event.preventDefault(); // Evita enviar el formulario si no pasa las validaciones
            
            var username = $("#username").val();
            var password = $("#password").val();

            // Validación adicional en JavaScript (opcional, ya está en HTML)
            var regex = /^[A-Za-z0-9]+$/;
            if (!regex.test(username) || !regex.test(password)) {
                alert("El nombre de usuario y la contraseña solo deben contener letras y números, sin caracteres especiales.");
                return;
            }

            var studentdata = { username: username, password: password };
            $.ajax({
                url: "/ingresarSistemaUsuario",
                dataType: 'json',
                type: 'POST',
                data: studentdata,
                success: function(data) {
                    alert(data.estado);
                    if (data.estado == 1) {
                        location.href = 'SCSE-Buscador.html';
                    } else if (data.estado == 2) {
                        location.href = 'SCSE-MenuProfesores.html';
                    } else {
                        alert("Error de inicio de sesión");
                    }
                }
            });
        });
    </script>
</body> 
</html>
